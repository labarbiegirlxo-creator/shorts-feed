name: Refresh Shorts feed

on:
  schedule:
    - cron: "17 9 */2 * *"   # every 2nd day of the month at 09:17 UTC (01:17 Pacific)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-shorts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feeds
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python build_packs.py
      - name: Commit updated feeds
        if: success()
        run: |
          git config user.name "shorts-feed bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds
          git diff --staged --quiet || git commit -m "Refresh Shorts feed $(date -u +%Y-%m-%d)"
          git push
