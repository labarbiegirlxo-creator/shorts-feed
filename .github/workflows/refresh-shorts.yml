name: Refresh Shorts feeds

on:
  schedule:
    - cron: "17 9 * * 1"   # every Monday, 09:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feeds
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python build_packs.py
      - name: Publish new feeds
        run: |
          git config user.name "shorts-feed-bot"
          git config user.email "shorts-feed-bot@users.noreply.github.com"
          git add feeds
          git diff --cached --quiet || git commit -m "Weekly Shorts refresh"
          git push
